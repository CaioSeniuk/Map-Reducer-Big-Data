name: correlacao-cluster

x-hadoop: &hadoop
  image: caiohseniuk/projeto-big-data-hadoop:v01
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    HADOOP_CONF_DIR: /tmp/hadoop-conf
    HADOOP_MAPRED_HOME: /opt/hadoop
    HADOOP_HEAPSIZE_MAX: "512"
    JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.lang=ALL-UNNAMED"
  entrypoint: ["bash", "/cluster/start.sh"]
  volumes:
    - ./cluster:/cluster:ro
  networks:
    - hadoop

services:
  namenode:
    <<: *hadoop
    hostname: namenode
    command: ["namenode"]
    volumes:
      - ./cluster:/cluster:ro
      - namenode-data:/data/hdfs/name
    ports:
      - "127.0.0.1:9870:9870"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9870/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  resourcemanager:
    <<: *hadoop
    hostname: resourcemanager
    command: ["resourcemanager"]
    ports:
      - "127.0.0.1:8088:8088"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/ws/v1/cluster/info"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  worker1:
    <<: *hadoop
    hostname: worker1
    command: ["worker"]
    depends_on:
      namenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
    volumes:
      - ./cluster:/cluster:ro
      - worker1-data:/data
    mem_limit: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9864/ >/dev/null && curl -fsS http://localhost:8042/ws/v1/node/info >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker2:
    <<: *hadoop
    hostname: worker2
    command: ["worker"]
    depends_on:
      namenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
    volumes:
      - ./cluster:/cluster:ro
      - worker2-data:/data
    mem_limit: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9864/ >/dev/null && curl -fsS http://localhost:8042/ws/v1/node/info >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  cliente:
    <<: *hadoop
    entrypoint: ["bash", "/cluster/start.sh", "cliente"]
    command: ["run"]
    profiles: ["tools"]
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
    volumes:
      - ./cluster:/cluster:ro
      - ..:/workspace
    mem_limit: 1g

networks:
  hadoop:

volumes:
  namenode-data:
  worker1-data:
  worker2-data:
